name: Arbiter News live publication
on:
  push:
    branches: [main]
    paths: ['_data/arbiter_news/**', '_layouts/arbiter-news.html', '_includes/arbiter-news-card.html', 'news/**', 'tests/check_news_live.py', '.github/workflows/arbiter-news-live.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arbiter-news-live
  cancel-in-progress: true
jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify latest, dated archive, coverage, RSS and assets over public HTTPS
        env:
          REVISION: ${{ github.sha }}
        run: python tests/check_news_live.py "$REVISION"
