name: Arbiter News live publication
on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arbiter-news-live
  cancel-in-progress: true
jobs:
  verify-public-pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify latest, dated archive, coverage, RSS and assets over public HTTPS
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python tests/check_news_live.py "$REVISION"
