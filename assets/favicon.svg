<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="arbiterForge">
  <!-- Rounded-tile favicon variant of assets/logomark.svg with thickened details for
       legibility at 16–32px. Keep in sync with the logomark's geometry. -->
  <title>arbiterForge</title>
  <defs>
    <linearGradient id="fav-gold" x1="38" y1="24" x2="94" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3c958"/>
      <stop offset=".48" stop-color="#f0b92f"/>
      <stop offset="1" stop-color="#d89920"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#06080c"/>
  <path data-brand-element="commit-line" d="M12 92H116" fill="none" stroke="#465565" stroke-width="5" stroke-linecap="round"/>
  <circle data-brand-element="unproven-node" cx="22" cy="92" r="7" fill="#06080c" stroke="#91a0b2" stroke-width="4"/>
  <g data-brand-element="gate-posts" fill="url(#fav-gold)">
    <path d="M39 48h16v36l6 10H33l6-10V48Z"/>
    <path d="M73 48h16v36l6 10H67l6-10V48Z"/>
  </g>
  <path data-brand-element="gate-beam" d="M28 32h72l-5 14H33l-5-14Z" fill="url(#fav-gold)"/>
  <path data-brand-element="terminal-chevron" d="m53 14 11 12 11-12" fill="none" stroke="#ffd568" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-brand-element="proven-node" cx="105" cy="92" r="9" fill="#f0b92f" stroke="#ffd568" stroke-width="3"/>
</svg>
