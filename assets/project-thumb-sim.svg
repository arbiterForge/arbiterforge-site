<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">SIM: service integration map</title>
<desc id="desc">An illustrative excerpt of the site's SIM fictional service demo: App portal in Network A consumes Identity in Network B and Monitoring from an External provider.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1b1d"/><stop offset="1" stop-color="#203637"/></linearGradient>
<linearGradient id="zone" x2="0" y2="1"><stop stop-color="#263e3a"/><stop offset="1" stop-color="#18312f"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#6b9e91" stop-opacity=".18"/><stop offset="1" stop-color="#6b9e91" stop-opacity="0"/></radialGradient>
<pattern id="mesh" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#a7cbbe" opacity=".13"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" stroke="#eac77e" fill="none" stroke-width="2"/></marker>
<marker id="mutedarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" stroke="#94b1a1" fill="none" stroke-width="1.8"/></marker>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect width="1200" height="800" fill="url(#mesh)"/>
<circle cx="540" cy="300" r="470" fill="url(#glow)"/>
<g font-family="ui-sans-serif,system-ui,Arial">
<text x="60" y="84" fill="#f7f3dd" font-size="38" font-weight="750">SIM</text>
<text x="152" y="84" fill="#d5e0d7" font-size="27">Service Integration Map</text>
<text x="1140" y="83" text-anchor="end" fill="#b4c8ba" font-size="18" letter-spacing="2">SERVICE RELATIONSHIPS</text>
<path d="M60 108H1140" stroke="#86a59a" opacity=".45"/>
<text x="60" y="150" fill="#d6d9bb" font-size="20" letter-spacing="1.8">DEMO DATASET / FICTIONAL EXAMPLE</text>
</g>
<g fill="url(#zone)" stroke="#6e9a90" stroke-width="2">
<rect x="60" y="185" width="325" height="464" rx="22"/>
<rect x="437" y="185" width="325" height="464" rx="22"/>
<rect x="814" y="185" width="325" height="464" rx="22"/>
</g>
<g font-family="ui-sans-serif,system-ui,Arial">
<text x="87" y="236" fill="#d2e4d6" font-size="27" font-weight="700" letter-spacing="2">NETWORK A</text>
<text x="464" y="236" fill="#d2e4d6" font-size="27" font-weight="700" letter-spacing="2">NETWORK B</text>
<text x="841" y="236" fill="#d2e4d6" font-size="27" font-weight="700" letter-spacing="2">EXTERNAL</text>
</g>
<g fill="#a2bfb2" opacity=".29">
<rect x="95" y="287" width="12" height="12" rx="3"/><rect x="144" y="315" width="12" height="12" rx="3"/><rect x="313" y="292" width="12" height="12" rx="3"/>
<rect x="471" y="293" width="12" height="12" rx="3"/><rect x="717" y="297" width="12" height="12" rx="3"/><rect x="533" y="495" width="12" height="12" rx="3"/>
<rect x="842" y="289" width="12" height="12" rx="3"/><rect x="1095" y="311" width="12" height="12" rx="3"/><rect x="1042" y="586" width="12" height="12" rx="3"/>
</g>
<path d="M345 396C404 396 431 398 477 398" stroke="#edc77f" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<path d="M345 426C519 627 667 602 854 546" stroke="#edc77f" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<path d="M698 396C753 396 790 379 854 374" stroke="#94b1a1" stroke-width="4" fill="none" opacity=".7" marker-end="url(#mutedarrow)"/>
<g stroke-width="2">
<rect x="112" y="344" width="234" height="104" rx="17" fill="#3d594d" stroke="#e3ba75" stroke-width="4"/>
<rect x="477" y="344" width="222" height="104" rx="17" fill="#3d594d" stroke="#91b5a0"/>
<rect x="854" y="322" width="244" height="104" rx="17" fill="#3d594d" stroke="#91b5a0"/>
<rect x="854" y="495" width="244" height="104" rx="17" fill="#3d594d" stroke="#91b5a0"/>
</g>
<g font-family="ui-sans-serif,system-ui,Arial" fill="#fcf6e5">
<text x="229" y="405" font-size="29" font-weight="650" text-anchor="middle">App portal</text>
<text x="588" y="405" font-size="29" font-weight="650" text-anchor="middle">Identity</text>
<text x="976" y="383" font-size="27" font-weight="650" text-anchor="middle">SSO provider</text>
<text x="976" y="556" font-size="29" font-weight="650" text-anchor="middle">Monitoring</text>
</g>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
<text x="88" y="607" font-size="21" letter-spacing="1" fill="#b9d0bb">CONSUMER</text>
<text x="470" y="607" font-size="21" letter-spacing="1" fill="#b9d0bb">PROVIDER</text>
</g>
<rect x="60" y="685" width="1079" height="74" rx="18" fill="#142a26" stroke="#537c6c"/>
<g font-family="ui-sans-serif,system-ui,Arial">
<path d="M91 723H169" stroke="#edc77f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="196" y="730" fill="#e1e7d8" font-size="22">Consumer</text>
<text x="326" y="730" fill="#e1e7d8" font-size="22">→ provider</text>
<text x="1113" y="730" text-anchor="end" fill="#abc4b7" font-size="19">App portal depends on Identity and Monitoring</text>
</g>
</svg>